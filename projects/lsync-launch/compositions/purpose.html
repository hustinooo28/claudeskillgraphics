<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/shared.css">
      <style>
        #purpose .panel { position: absolute; height: 24cqh; display: flex; align-items: flex-end; padding: 0 var(--m) calc(var(--u) * 4.4); will-change: transform; }
        #purpose .pa { top: 28cqh; left: 0; width: 90cqw; }
        #purpose .pb { top: 54cqh; left: 10cqw; width: 90cqw; }
        #purpose .pa .display-s { color: var(--paper); }
        #purpose .pb .display-s { color: var(--ink); }
        #purpose .rule-h { left: var(--m); right: var(--m); top: calc(53cqh - 1px); background: var(--accent); }
        @container (orientation: landscape) {
          #purpose .panel { height: 32cqh; }
          #purpose .pa { top: 16cqh; width: 78cqw; }
          #purpose .pb { top: 52cqh; left: 22cqw; width: 78cqw; }
          #purpose .rule-h { top: calc(50cqh - 1px); }
        }
      </style>
      <!-- Bars 4-5. Hard cut to ink on f360. Two solid panels from opposite sides, each led by two offset copies. -->
      <div data-hf-id="hf-wy1g" id="purpose" class="beat" data-composition-id="purpose" data-width="1080" data-height="1920">
        <div data-hf-id="hf-tan6" class="stage">
          <div data-hf-id="hf-gg0z" class="fill ink"></div>
          <div data-hf-id="hf-0q5y" class="panel pa accent ca1"></div>
          <div data-hf-id="hf-zdv3" class="panel pa paper ca2"></div>
          <div data-hf-id="hf-vtsu" class="panel pa brand ma"><div data-hf-id="hf-cnsi" class="display-s"><span data-hf-id="hf-jyj0" class="lm"><span data-hf-id="hf-dibg" class="ln ta">For every</span></span></div></div>
          <div data-hf-id="hf-ik4e" class="panel pb accent cb1"></div>
          <div data-hf-id="hf-e45g" class="panel pb brand cb2"></div>
          <div data-hf-id="hf-jxrb" class="panel pb paper mb"><div data-hf-id="hf-o0fq" class="display-s"><span data-hf-id="hf-p1gk" class="lm"><span data-hf-id="hf-wkmk" class="ln tb">student.</span></span></div></div>
          <div data-hf-id="hf-t3n7" class="rule rule-h"></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 360;
          const F = (n) => n / 60;
          const L = (f) => F(f - T0);
          const q = (s) => document.querySelector("#purpose " + s);
          const tl = gsap.timeline({ paused: true });
          const enter = { duration: F(16), ease: "expo.out" };

          // Panel A from the left on f360: accent copy, paper copy, then the brand panel, 3 f apart.
          [".ca1", ".ca2", ".ma"].forEach((s, i) => tl.fromTo(q(s), { xPercent: -101 }, { xPercent: 0, ...enter }, L(360 + i * 3)));
          // Panel B from the right on the next eighth (f375).
          [".cb1", ".cb2", ".mb"].forEach((s, i) => tl.fromTo(q(s), { xPercent: 101 }, { xPercent: 0, ...enter }, L(375 + i * 3)));
          tl.fromTo(q(".ta"), { yPercent: 110 }, { yPercent: 0, duration: F(16), ease: "expo.out" }, L(390));
          tl.fromTo(q(".tb"), { yPercent: 110 }, { yPercent: 0, duration: F(16), ease: "expo.out" }, L(405));
          // Bar 5 downbeat: an accent hairline draws between the panels (linear, hairline only).
          tl.fromTo(q(".rule-h"), { scaleX: 0 }, { scaleX: 1, duration: F(30), ease: "none" }, L(480));

          // Exit on the last beat of bar 5: panels leave the way they came (expo.in, 12 f), done by f582.
          tl.fromTo(q(".rule-h"), { scaleX: 1 }, { scaleX: 0, duration: F(12), ease: "expo.in", immediateRender: false }, L(570));
          tl.fromTo([q(".ma"), q(".ca2"), q(".ca1")], { xPercent: 0 }, { xPercent: -101, duration: F(12), ease: "expo.in", stagger: F(1), immediateRender: false }, L(570));
          tl.fromTo([q(".mb"), q(".cb2"), q(".cb1")], { xPercent: 0 }, { xPercent: 101, duration: F(12), ease: "expo.in", stagger: F(1), immediateRender: false }, L(570));
          // f585-599: empty ink field, the eighth-note silence. Hard cut to the reveal on f600.
          tl.set({}, {}, L(600));
          window.__timelines["purpose"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
