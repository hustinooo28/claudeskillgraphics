<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/shared.css">
      <style>
        #statement .wipe { will-change: transform; }
        #statement .block { position: absolute; left: var(--m); right: var(--m); top: 50cqh; transform: translateY(-50%); }
        #statement .on-brand { color: var(--paper); }
        #statement .on-paper { color: var(--ink); }
      </style>
      <!-- Bars 2-3. Starts at f105 (local 0) over the cold open; transparent until the brand wipe covers it. -->
      <div data-hf-id="hf-mipo" id="statement" class="beat" data-composition-id="statement" data-width="1080" data-height="1920">
        <div data-hf-id="hf-tan6" class="stage">
          <div data-hf-id="hf-u6vi" class="fill brand wipe wipe-brand"></div>
          <div data-hf-id="hf-pd8j" class="block on-brand display blk-a">
            <span data-hf-id="hf-jyj0" class="lm"><span data-hf-id="hf-8cmm" class="ln a1">The</span></span>
            <span data-hf-id="hf-p1gk" class="lm"><span data-hf-id="hf-rcdj" class="ln a2">council’s</span></span>
            <span data-hf-id="hf-nujh" class="lm"><span data-hf-id="hf-3te9" class="ln a3">records</span></span>
          </div>
          <div data-hf-id="hf-5tqy" class="fill paper wipe wipe-paper"></div>
          <div data-hf-id="hf-dl9p" class="block on-paper display blk-b">
            <span data-hf-id="hf-o8ui" class="lm"><span data-hf-id="hf-x7g3" class="ln b1">made</span></span>
            <span data-hf-id="hf-q8dn" class="lm"><span data-hf-id="hf-l2rm" class="ln b2">public.</span></span>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 105; // slot start in film frames
          const F = (n) => n / 60;
          const L = (filmFrame) => F(filmFrame - T0); // film frame -> local seconds
          const q = (s) => document.querySelector("#statement " + s);
          const tl = gsap.timeline({ paused: true });

          // Only one phrase block is live at a time: B appears when the paper field is down, A goes when it is covered.
          tl.set(q(".blk-b"), { autoAlpha: 0 }, 0).set(q(".blk-b"), { autoAlpha: 1 }, L(247));
          tl.set(q(".blk-a"), { autoAlpha: 0 }, L(247));
          // Field inversion 1: brand wipes in from the left; its leading edge crosses frame centre on f120.
          tl.fromTo(q(".wipe-brand"), { xPercent: -100 }, { xPercent: 0, duration: F(14), ease: "power4.inOut" }, L(113));
          // "The council's" (one phrase, lines 3 f apart), then "records" on the next beat.
          tl.fromTo([q(".a1"), q(".a2")], { yPercent: 110 }, { yPercent: 0, duration: F(16), ease: "expo.out", stagger: F(3) }, L(124));
          tl.fromTo(q(".a3"), { yPercent: 110 }, { yPercent: 0, duration: F(16), ease: "expo.out" }, L(150));

          // Field inversion 2: paper wipes in from the right; leading edge crosses centre on f240.
          tl.fromTo(q(".wipe-paper"), { xPercent: 100 }, { xPercent: 0, duration: F(14), ease: "power4.inOut" }, L(233));
          tl.fromTo(q(".b1"), { yPercent: 110 }, { yPercent: 0, duration: F(16), ease: "expo.out" }, L(247));
          tl.fromTo(q(".b2"), { yPercent: 110 }, { yPercent: 0, duration: F(16), ease: "expo.out" }, L(270));
          // Payoff "public." holds 74 f, then a hard cut to the purpose beat on f360.
          tl.set({}, {}, L(360));
          window.__timelines["statement"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
