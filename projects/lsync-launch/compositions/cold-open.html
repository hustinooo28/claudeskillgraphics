<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/shared.css">
      <style>
        #cold-open .rule-h { left: var(--m); right: var(--m); top: 50cqh; background: var(--accent); }
        #cold-open .lab { position: absolute; left: var(--m); right: var(--m); color: var(--paper); }
        #cold-open .lab-a { bottom: calc(50cqh + var(--u) * 2.6); }
        #cold-open .lab-b { top: calc(50cqh + var(--u) * 2.6); }
      </style>
      <div data-hf-id="hf-cub4" id="cold-open" class="beat" data-composition-id="cold-open" data-width="1080" data-height="1920">
        <div data-hf-id="hf-tan6" class="stage">
          <div data-hf-id="hf-gg0z" class="fill ink"></div>
          <div data-hf-id="hf-t3n7" class="rule rule-h"></div>
          <div data-hf-id="hf-i2in" class="lab lab-a label">Local Student Council</div>
          <div data-hf-id="hf-sx1d" class="lab lab-b label">DSSC — Santa Cruz Extension Campus</div>
        </div>
      </div>
      <script>
        (function () {
          const F = (n) => n / 60; // frames at 60 fps -> seconds
          const root = document.querySelector("#cold-open");
          const words = (el) => {
            const parts = el.textContent.trim().split(" ");
            el.textContent = "";
            return parts.map((w, i) => {
              const o = document.createElement("span"); o.className = "wd";
              const n = document.createElement("span"); n.textContent = w;
              o.appendChild(n); el.appendChild(o);
              if (i < parts.length - 1) el.appendChild(document.createTextNode(" "));
              return n;
            });
          };
          const a = words(root.querySelector(".lab-a"));
          const b = words(root.querySelector(".lab-b"));
          const tl = gsap.timeline({ paused: true });
          // Bar 1, beat 1 eighth: accent hairline draws left -> right (the only linear motion in the film).
          tl.fromTo(root.querySelector(".rule-h"), { scaleX: 0 }, { scaleX: 1, duration: F(30), ease: "none" }, F(15));
          // ORG label: per-word steps, 3 f apart, rising out of the baseline mask.
          tl.fromTo(a, { yPercent: 110 }, { yPercent: 0, duration: F(14), ease: "expo.out", stagger: F(3) }, F(45));
          tl.fromTo(b, { yPercent: -110 }, { yPercent: 0, duration: F(14), ease: "expo.out", stagger: F(3) }, F(60));
          tl.set({}, {}, F(135));
          window.__timelines["cold-open"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
