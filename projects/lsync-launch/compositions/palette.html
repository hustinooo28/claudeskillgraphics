<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/shared.css">
      <style>
        #palette .word { position: absolute; font-weight: 700; letter-spacing: -0.05em; line-height: 0.82; white-space: nowrap; }
        #palette .sw { position: absolute; }
      </style>
      <!-- Bars 7-8 (f720-960). REF_A "HIGH" + colour split: a giant cropped word pulls back to the top-left, then the
           palette arrives as solid fields with their specs — ink rises from below, brand slides in from the right,
           gold follows. Each field repeats the word in its own colours. -->
      <div data-hf-id="hf-wdb8" id="palette" class="beat" data-composition-id="palette" data-width="1080" data-height="1920">
        <div data-hf-id="hf-wvtw" class="stage sg"></div>
      </div>
      <script>
        (function () {
          const root = document.querySelector("#palette");
          const st = root.querySelector(".stage");
          const { W, H, land } = LK.dims(root);
          const { C, F, el } = LK;
          const T0 = 720, L = (f) => F(f - T0);
          const tl = gsap.timeline({ paused: true });
          el(st, "div", "fill", { background: C.paper });

          const G = land
            ? { fs: 440, word: [64, 40], from: { s: 3.1, x: -1700, y: -260 }, inkTop: 560, small: 210, brandX: 1180, brandX2: 900, goldX: 1560, specPaper: [1500, 64], m: 64 }
            : { fs: 310, word: [56, 250], from: { s: 3, x: -1050, y: -300 }, inkTop: 1010, small: 170, brandX: 600, brandX2: 470, goldX: 880, specPaper: [640, 600], m: 56 };

          const mark = (n) => { n.setAttribute("data-layout-allow-overlap", ""); n.setAttribute("data-layout-allow-occlusion", ""); n.setAttribute("data-layout-allow-overflow", ""); return n; };
          const swatch = (parent, x, y, name, hex, rgb, color) => {
            const b = el(parent, "div", "abs", { left: x, top: y, width: 300, color });
            const n = el(b, "div", "cap", { fontWeight: 600 }, name);
            const h = el(b, "div", "spec", { marginTop: 6 }, `${hex}  ·  RGB ${rgb}`);
            return [...LK.split(n, "word"), ...LK.split(h, "word")];
          };

          // f720: the word, huge and cropped, pulls back to its resting place (expo.out, 54 f) then keeps easing back.
          const big = mark(el(st, "div", "word", { left: G.word[0], top: G.word[1], fontSize: G.fs, color: C.ink, transformOrigin: "0 0" }, "OPEN"));
          tl.fromTo(big, { scale: G.from.s, x: G.from.x, y: G.from.y }, { scale: 1, x: 0, y: 0, duration: F(54), ease: "expo.out" }, 0);
          tl.to(big, { scale: 0.95, duration: F(186), ease: "none" }, F(54));
          const sp = swatch(st, G.specPaper[0], G.specPaper[1], "Paper", "#F4F6FC", "244 246 252", C.ink);
          tl.fromTo(sp, { yPercent: 110 }, { yPercent: 0, duration: F(8), ease: "expo.out", stagger: F(1) }, L(758));

          // f770: ink rises from below, carrying the word again in paper.
          const ink = el(st, "div", "sw", { left: 0, top: G.inkTop, width: W, height: H - G.inkTop + 40, background: C.ink, overflow: "hidden" });
          mark(el(ink, "div", "word", { left: G.m, bottom: land ? 70 : 440, fontSize: G.small, color: C.paper }, "OPEN"));
          const si = swatch(ink, land ? 1500 : G.m, land ? 40 : 40, "Ink", "#080D22", "8 13 34", C.paper);
          tl.fromTo(ink, { y: H - G.inkTop + 40 }, { y: 0, duration: F(16), ease: "expo.out" }, L(770));
          tl.fromTo(si, { yPercent: 110 }, { yPercent: 0, duration: F(8), ease: "expo.out", stagger: F(1) }, L(784));

          // f840: brand slides in from the right (bar 8 downbeat); f870 it pushes further as gold arrives.
          const brand = el(st, "div", "sw", { left: 0, top: 0, width: W, height: H, background: C.brand, overflow: "hidden" });
          mark(el(brand, "div", "word", { left: G.m, top: land ? -46 : 250, fontSize: G.small, color: C.paper }, "OPEN"));
          const sb = swatch(brand, G.m, land ? 520 : 1300, "Royal Blue", "#526FF2", "82 111 242", C.paper);
          tl.fromTo(brand, { x: W }, { x: G.brandX, duration: F(16), ease: "expo.out" }, L(840));
          tl.fromTo(sb, { yPercent: 110 }, { yPercent: 0, duration: F(8), ease: "expo.out", stagger: F(1) }, L(850));
          tl.to(brand, { x: G.brandX2, duration: F(14), ease: "power4.inOut" }, L(870));
          const gold = el(st, "div", "sw", { left: 0, top: 0, width: W, height: H, background: C.accent, overflow: "hidden" });
          const sg = swatch(gold, land ? 40 : 30, land ? 520 : 1300, "Gold", "#D6B05C", "214 176 92", C.ink);
          tl.fromTo(gold, { x: W }, { x: G.goldX, duration: F(16), ease: "expo.out" }, L(872));
          tl.fromTo(sg, { yPercent: 110 }, { yPercent: 0, duration: F(8), ease: "expo.out", stagger: F(1) }, L(884));
          // Bar 8, beats 3-4: the whole split keeps sliding left (the camera never parks).
          tl.to([brand, gold], { x: "-=70", duration: F(66), ease: "none" }, L(894));
          tl.set({}, {}, L(960));
          window.__timelines["palette"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
