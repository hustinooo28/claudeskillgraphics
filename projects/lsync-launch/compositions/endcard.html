<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/shared.css">
      <style>
        #endcard .wrap { position: absolute; left: var(--m); right: var(--m); top: 22cqh; color: var(--paper); }
        #endcard .live { display: flex; align-items: center; gap: calc(var(--u) * 1.6); }
        #endcard .dot { width: calc(var(--u) * 1.8); height: calc(var(--u) * 1.8); border-radius: 50%; background: var(--accent); flex: none; }
        #endcard .seal-mask { margin-top: calc(var(--u) * 6); width: calc(var(--u) * 24); height: calc(var(--u) * 24); overflow: hidden; }
        #endcard .seal { width: 100%; height: 100%; display: block; }
        #endcard .name { margin-top: calc(var(--u) * 4.4); }
        #endcard .rule-e { position: relative; display: block; margin-top: calc(var(--u) * 5.2); height: 2px; background: var(--paper); transform-origin: 0 50%; }
        #endcard .foot { margin-top: calc(var(--u) * 3.2); display: flex; flex-direction: column; gap: calc(var(--u) * 1.6); }
        #endcard .url { font-weight: 600; font-size: var(--feature); line-height: 1.05; letter-spacing: -0.02em; }
        @container (orientation: landscape) {
          #endcard .wrap { top: 50cqh; transform: translateY(-50%); }
          #endcard .mid { display: grid; grid-template-columns: calc(var(--col) * 3 + var(--g) * 2) 1fr; column-gap: var(--g); align-items: end; margin-top: calc(var(--u) * 5); }
          #endcard .seal-mask { margin-top: 0; width: calc(var(--col) * 3 + var(--g) * 2); height: calc(var(--col) * 3 + var(--g) * 2); }
          #endcard .name { margin-top: 0; }
          #endcard .foot { flex-direction: row; justify-content: space-between; align-items: baseline; }
        }
      </style>
      <!-- Bar 12. Ink field. Elements land 6 f apart from f1320, all settled by f1380, then a 90-frame still hold. -->
      <div data-hf-id="hf-1ysw" id="endcard" class="beat" data-composition-id="endcard" data-width="1080" data-height="1920">
        <div data-hf-id="hf-tan6" class="stage">
          <div data-hf-id="hf-gg0z" class="fill ink"></div>
          <div data-hf-id="hf-wnm4" class="wrap">
            <div data-hf-id="hf-h6sc" class="live label"><span data-hf-id="hf-9gry" class="dot"></span><span data-hf-id="hf-jyj0" class="lm"><span data-hf-id="hf-rk15" class="ln e1">Now live</span></span></div>
            <div data-hf-id="hf-wgyu" class="mid">
              <div data-hf-id="hf-6e5w" class="seal-mask"><img data-hf-id="hf-ohfb" class="seal" src="assets/lsc-seal.png" alt="Local Student Council seal"></div>
              <div data-hf-id="hf-2hlz" class="name display-s">
                <span data-hf-id="hf-p1gk" class="lm"><span data-hf-id="hf-s86y" class="ln n1">Digital</span></span>
                <span data-hf-id="hf-nujh" class="lm"><span data-hf-id="hf-kjij" class="ln n2">Transparency</span></span>
                <span data-hf-id="hf-o8ui" class="lm"><span data-hf-id="hf-y7w0" class="ln n3">Board</span></span>
              </div>
            </div>
            <span data-hf-id="hf-k33l" class="rule-e"></span>
            <div data-hf-id="hf-mlgk" class="foot">
              <span data-hf-id="hf-q8dn" class="lm"><span data-hf-id="hf-8fwm" class="ln url e4">lsync.vercel.app</span></span>
              <span data-hf-id="hf-seke" class="lm label"><span data-hf-id="hf-p5i5" class="ln e5">A.Y. 2026–2027</span></span>
            </div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 1320;
          const F = (n) => n / 60;
          const L = (f) => F(f - T0);
          const q = (s) => document.querySelector("#endcard " + s);
          const tl = gsap.timeline({ paused: true });
          const IN = { yPercent: 0, duration: F(16), ease: "expo.out" };
          // f1320 (final impact): the accent dot and NOW LIVE.
          tl.fromTo(q(".dot"), { scale: 0 }, { scale: 1, duration: F(12), ease: "expo.out" }, L(1320));
          tl.fromTo(q(".e1"), { yPercent: 110 }, IN, L(1320));
          tl.fromTo(q(".seal"), { yPercent: 100 }, { yPercent: 0, duration: F(18), ease: "expo.out" }, L(1326));
          tl.fromTo([q(".n1"), q(".n2"), q(".n3")], { yPercent: 110 }, { ...IN, stagger: F(3) }, L(1332));
          tl.fromTo(q(".rule-e"), { scaleX: 0 }, { scaleX: 1, duration: F(16), ease: "expo.out" }, L(1338));
          tl.fromTo(q(".e4"), { yPercent: 110 }, IN, L(1338));
          tl.fromTo(q(".e5"), { yPercent: 110 }, IN, L(1344));
          // Settled by f1362; nothing moves from f1380 to the end (f1469).
          tl.set({}, {}, L(1470));
          window.__timelines["endcard"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
