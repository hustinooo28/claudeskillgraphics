<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/shared.css">
      <!-- Bars 1-2 (f0-240). REF_A "Brand Principles": dashed construction grid, one short principle per shot,
           the field inverts every second beat (paper -> ink -> brand -> paper), guides re-position on each cut. -->
      <div data-hf-id="hf-ywxi" id="principles" class="beat" data-composition-id="principles" data-width="1080" data-height="1920">
        <div data-hf-id="hf-wvtw" class="stage sg"></div>
      </div>
      <script>
        (function () {
          const root = document.querySelector("#principles");
          const st = root.querySelector(".stage");
          const { W, H, land } = LK.dims(root);
          const { C, F, el } = LK;
          const L = (f) => F(f);
          const tl = gsap.timeline({ paused: true });

          const SHOTS = [
            { at: 0, bg: C.paper, fg: C.ink, text: "Open every record.", xs: land ? [690, 1230] : [150, 930] },
            { at: 60, bg: C.ink, fg: C.paper, text: "Show every peso.", xs: land ? [610, 1310] : [110, 970] },
            { at: 120, bg: C.brand, fg: C.paper, text: "Hear every student.", xs: land ? [750, 1170] : [190, 890] },
            { at: 180, bg: C.paper, fg: C.ink, text: "One step better than yesterday.", xs: land ? [650, 1270] : [130, 950] },
          ];
          const Y = land ? 540 : 960;                 // the text guide
          const YS = land ? [190, 890] : [520, 1400];  // short secondary guides
          const fs = land ? 30 : 44;

          const bg = el(st, "div", "fill", { background: C.paper });
          const g = LK.svg(st, W, H);
          const vx = SHOTS[0].xs;
          const v1 = LK.line(g, vx[0], 0, vx[0], H, C.ink), v2 = LK.line(g, vx[1], H, vx[1], 0, C.ink);
          const hz = LK.line(g, 0, Y, W, Y, C.ink);
          const s1 = LK.line(g, vx[0] - 120, YS[0], vx[1] + 120, YS[0], C.ink);
          const s2 = LK.line(g, vx[1] + 120, YS[1], vx[0] - 120, YS[1], C.ink);
          const DOTS = [[0, Y], [1, Y], [0, YS[0]], [1, YS[0]], [0, YS[1]], [1, YS[1]]];
          const dots = DOTS.map(([k, y]) => LK.dot(g, vx[k], y, 3.5, C.ink));

          // f0-24: the grid draws itself.
          LK.draw(tl, hz, 0, F(24)); LK.draw(tl, v1, F(4), F(24)); LK.draw(tl, v2, F(4), F(24));
          LK.draw(tl, s1, F(8), F(22)); LK.draw(tl, s2, F(8), F(22));
          tl.fromTo(dots, { attr: { r: 0 } }, { attr: { r: 3.5 }, duration: F(10), ease: "expo.out", stagger: F(1) }, F(14));

          const label = el(st, "div", "abs cap nowrap", { left: 0, width: W, textAlign: "center", top: land ? 36 : 250, color: C.ink }, "Digital Transparency Board — Launch principles");
          tl.fromTo(LK.split(label, "word"), { yPercent: 110 }, { yPercent: 0, duration: F(10), ease: "expo.out", stagger: F(2) }, F(6));

          SHOTS.forEach((sh, i) => {
            const a = L(sh.at), b = i < 3 ? L(SHOTS[i + 1].at) : null;
            if (i > 0) {
              // Hard cut on the beat: field + guide colours flip, guides slide to the new grid (power4.inOut, 10 f).
              const p = SHOTS[i - 1].xs, mv = { duration: F(10), ease: "power4.inOut", immediateRender: false };
              tl.set(bg, { background: sh.bg }, a);
              tl.set([v1, v2, hz, s1, s2], { attr: { stroke: sh.fg } }, a).set(dots, { attr: { fill: sh.fg } }, a);
              tl.set(label, { color: sh.fg }, a);
              tl.fromTo(v1, { attr: { x1: p[0], x2: p[0] } }, { attr: { x1: sh.xs[0], x2: sh.xs[0] }, ...mv }, a);
              tl.fromTo(v2, { attr: { x1: p[1], x2: p[1] } }, { attr: { x1: sh.xs[1], x2: sh.xs[1] }, ...mv }, a);
              tl.fromTo(s1, { attr: { x1: p[0] - 120, x2: p[1] + 120 } }, { attr: { x1: sh.xs[0] - 120, x2: sh.xs[1] + 120 }, ...mv }, a);
              tl.fromTo(s2, { attr: { x1: p[1] + 120, x2: p[0] - 120 } }, { attr: { x1: sh.xs[1] + 120, x2: sh.xs[0] - 120 }, ...mv }, a);
              DOTS.forEach(([k], j) => tl.fromTo(dots[j], { attr: { cx: p[k] } }, { attr: { cx: sh.xs[k] }, ...mv }, a));
            }
            // The principle sits on the text guide, left-aligned to the first vertical; words rise 3 f apart.
            const t = el(st, "div", "abs", {
              left: sh.xs[0] + 14, bottom: H - Y + 12, width: sh.xs[1] - sh.xs[0] - 28,
              fontSize: fs, fontWeight: 500, lineHeight: 1.15, letterSpacing: "-0.01em", color: sh.fg,
            }, sh.text);
            const ws = LK.split(t, "word");
            LK.live(tl, t, a, b);
            tl.fromTo(ws, { yPercent: 110 }, { yPercent: 0, duration: F(10), ease: "expo.out", stagger: F(3) }, a + F(i === 0 ? 20 : 6));
            const n = el(st, "div", "abs idx", { left: 0, width: W, textAlign: "center", top: land ? 1010 : 1490, color: sh.fg }, String(i + 1).padStart(2, "0"));
            LK.live(tl, n, i === 0 ? L(16) : a, b);
          });
          tl.set({}, {}, L(240));
          window.__timelines["principles"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
