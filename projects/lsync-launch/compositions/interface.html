<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/shared.css">
      <style>
        #interface .card { position: absolute; border: 2px solid var(--ink); background: var(--paper); overflow: hidden; will-change: transform; }
        #interface .card img { display: block; width: 100%; height: 100%; }
      </style>
      <!-- Bar 10 (f1080-1200). The product, in the same system: the three live pages land as a stack (3 f apart),
           fan out into a row on the beat with their index labels, then a crop push into the Transparency Board. -->
      <div data-hf-id="hf-3i9s" id="interface" class="beat" data-composition-id="interface" data-width="1080" data-height="1920">
        <div data-hf-id="hf-wvtw" class="stage sg"></div>
      </div>
      <script>
        (function () {
          const root = document.querySelector("#interface");
          const st = root.querySelector(".stage");
          const { W, H, land } = LK.dims(root);
          const { C, F, el } = LK;
          const T0 = 1080, L = (f) => F(f - T0);
          const tl = gsap.timeline({ paused: true });
          el(st, "div", "fill", { background: C.paper });

          const G = land
            ? { cw: 1120, cx: 960, cy: 575, s: 0.46, fan: [[372, 575], [960, 575], [1548, 575]], lab: (x, y, w, h) => [x - w / 2, y + h / 2 + 20], push: 2.05, head: [70, 56] }
            : { cw: 900, cx: 540, cy: 960, s: 0.47, fan: [[640, 640], [640, 960], [640, 1280]], lab: (x, y, w, h) => [56, y - 24], push: 2.4, head: [56, 250] };
          const ch = G.cw * 0.625;

          const head = el(st, "div", "abs", { left: G.head[0], top: G.head[1], width: 700, color: C.ink });
          const hh = el(head, "div", "cap", { fontWeight: 600 }, "Interface");
          const hs = el(head, "div", "spec", { marginTop: 6 }, "lsync.vercel.app — Records · Transparency · Inquiry");
          tl.fromTo([...LK.split(hh, "word"), ...LK.split(hs, "word")], { yPercent: 110 }, { yPercent: 0, duration: F(8), ease: "expo.out", stagger: F(1) }, F(4));

          const layer = el(st, "div", "fill");
          const PAGES = [["page-records", "01", "Records"], ["page-transparency", "02", "Transparency"], ["page-inquiry", "03", "Inquiry"]];
          const order = [0, 2, 1]; // transparency lands last, on top
          const cards = [];
          order.forEach((k, i) => {
            const c = el(layer, "div", "card", { left: G.cx - G.cw / 2, top: G.cy - ch / 2, width: G.cw, height: ch });
            const im = el(c, "img"); im.src = `assets/stack/${PAGES[k][0]}.jpg`; im.alt = "";
            cards[k] = c;
            // Land as a stack: slide in from the right with 24 px offsets, 3 f apart.
            tl.fromTo(c, { x: W, y: (i - 1) * 24 }, { x: (i - 1) * 24, y: (i - 1) * 24, duration: F(14), ease: "expo.out" }, F(i * 3));
          });
          // f1110: fan out into the system row (power4.inOut, 18 f).
          PAGES.forEach((p, k) => {
            const [x, y] = G.fan[k];
            tl.to(cards[k], { x: x - G.cx, y: y - G.cy, scale: G.s, duration: F(18), ease: "power4.inOut" }, L(1110));
            const [lx, ly] = G.lab(x, y, G.cw * G.s, ch * G.s);
            const lb = el(st, "div", "abs nowrap", { left: lx, top: ly, color: C.ink });
            const n = el(lb, "span", "idx", { color: C.brand, marginRight: 14 }, p[1]);
            const t = el(lb, "span", "cap", null, p[2]);
            tl.fromTo([...LK.split(n, "word"), ...LK.split(t, "word")], { yPercent: 110 }, { yPercent: 0, duration: F(8), ease: "expo.out", stagger: F(2) }, L(1124 + k * 3));
            tl.to(lb, { autoAlpha: 0, duration: 0 }, L(1140));
          });
          // f1140: crop push into the Transparency Board; keeps creeping until the cut.
          const [tx, ty] = G.fan[1];
          tl.to(layer, { scale: G.push, x: G.cx - tx, y: (land ? 40 : 0) + G.cy - ty, transformOrigin: `${tx}px ${ty}px`, duration: F(20), ease: "power4.inOut" }, L(1140));
          tl.to(layer, { scale: G.push * 1.05, duration: F(40), ease: "none" }, L(1160));
          tl.set({}, {}, L(1200));
          window.__timelines["interface"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
