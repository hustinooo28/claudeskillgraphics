<!DOCTYPE html>
<html>

  <body>
    <template>
      <link rel="stylesheet" href="assets/shared.css">
      <!-- Bar 12 (f1320-1470). REF_A signature beat: small, centred, still. NOW LIVE, the URL in brand blue, the site
           name and the academic year. Everything lands 6 f apart on the final impact and is still from f1360. -->
      <div data-hf-id="hf-cu7w" id="signoff" class="beat" data-composition-id="signoff" data-width="1080" data-height="1920">
        <div data-hf-id="hf-wvtw" class="stage sg"></div>
      </div>
      <script>
        (function () {
          const root = document.querySelector("#signoff");
          const st = root.querySelector(".stage");
          const { W, H, land } = LK.dims(root);
          const { C, F, el } = LK;
          const T0 = 1320, L = (f) => F(f - T0);
          const tl = gsap.timeline({ paused: true });
          el(st, "div", "fill", { background: C.paper });
          const cy = land ? 540 : 900;

          const box = el(st, "div", "abs", { left: 0, width: W, top: cy - 90, textAlign: "center", color: C.ink });
          const live = el(box, "div", null, { display: "flex", justifyContent: "center", alignItems: "center", gap: "14px" });
          const dot = el(live, "span", null, { width: 14, height: 14, borderRadius: "50%", background: C.brand, display: "inline-block" });
          const nl = el(live, "span", "idx", { fontWeight: 600 }, "NOW LIVE");
          const url = el(box, "div", "nowrap", { marginTop: 22, fontSize: land ? 72 : 92, fontWeight: 600, letterSpacing: "-0.03em", lineHeight: 1.05, color: C.brand }, "lsync.vercel.app");
          const nm = el(box, "div", "cap", { marginTop: 22 }, "Digital Transparency Board");
          const ay = el(box, "div", "spec", { marginTop: 4 }, "Local Student Council · A.Y. 2026–2027");

          tl.fromTo(dot, { scale: 0 }, { scale: 1, duration: F(10), ease: "expo.out" }, 0);
          tl.fromTo(LK.split(nl, "word"), { yPercent: 110 }, { yPercent: 0, duration: F(10), ease: "expo.out", stagger: F(2) }, 0);
          tl.fromTo(LK.split(url, "char"), { yPercent: 115 }, { yPercent: 0, duration: F(12), ease: "expo.out", stagger: F(1) }, F(6));
          tl.fromTo(LK.split(nm, "word"), { yPercent: 110 }, { yPercent: 0, duration: F(10), ease: "expo.out", stagger: F(2) }, F(18));
          tl.fromTo(LK.split(ay, "word"), { yPercent: 110 }, { yPercent: 0, duration: F(10), ease: "expo.out", stagger: F(1) }, F(24));
          // Settled by f1360; still to the last frame (f1469).
          tl.set({}, {}, L(1470));
          window.__timelines["signoff"] = tl;
        })();
      </script>
    </template>
