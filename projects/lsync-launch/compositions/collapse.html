<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/shared.css">
      <style>
        #collapse .bframe { left: var(--m); width: calc(100cqw - 2 * var(--m)); top: 23.8cqh; height: 53.4cqh; will-change: transform; }
        @container (orientation: landscape) {
          #collapse .bframe { left: calc(var(--m) + (var(--col) + var(--g)) * 4); width: calc(var(--col) * 8 + var(--g) * 7); top: 50cqh; }
        }
        #collapse .inkp { will-change: clip-path; }
      </style>
      <!-- Bar 11. The tour frame shrinks to a tile, the other two pages stack onto it on eighths,
           the stack collapses into one ink panel, and that panel expands to full frame (ink by f1290). -->
      <div data-hf-id="hf-2fke" id="collapse" class="beat" data-composition-id="collapse" data-width="1080" data-height="1920">
        <div data-hf-id="hf-tan6" class="stage">
          <div data-hf-id="hf-hbf9" class="fill paper"></div>
          <div data-hf-id="hf-wza2" class="bframe f3"><div data-hf-id="hf-i2gl" class="bbar"><span data-hf-id="hf-zq2w" class="label">lsync.vercel.app</span></div><div data-hf-id="hf-wd71" class="bview"><img data-hf-id="hf-cffs" class="p3" src="assets/captures/03-inquiry.png" alt=""></div></div>
          <div data-hf-id="hf-0xe3" class="bframe f2"><div data-hf-id="hf-iz3d" class="bbar"><span data-hf-id="hf-0d34" class="label">lsync.vercel.app</span></div><div data-hf-id="hf-fmyp" class="bview"><img data-hf-id="hf-f239" class="p2" src="assets/captures/02-transparency-full.png" alt=""></div></div>
          <div data-hf-id="hf-s9i8" class="bframe f1"><div data-hf-id="hf-k60g" class="bbar"><span data-hf-id="hf-z661" class="label">lsync.vercel.app</span></div><div data-hf-id="hf-gtvs" class="bview"><img data-hf-id="hf-f69a" class="p1" src="assets/captures/01-landing.png" alt=""></div></div>
          <div data-hf-id="hf-q3zt" class="fill ink inkp"></div>
        </div>
      </div>
      <script>
        (function () {
          const T0 = 1200;
          const F = (n) => n / 60;
          const L = (f) => F(f - T0);
          const root = document.querySelector("#collapse");
          const q = (s) => root.querySelector(s);
          const land = +root.dataset.width > +root.dataset.height;
          const W = land ? 1920 : 1080, H = land ? 1080 : 1920;
          // Same frame geometry as the tour's last state, so the cut on f1200 is invisible.
          const G = land
            ? { fx: 115 + 142.83 * 4, fw: 1119, fh: Math.round(1115 * 0.625 + 58 + 4), p: { p1: [1115, 0], p2: [1115, 0], p3: [1115, 0] } }
            : { fx: 65, fw: 950, fh: 1025, p: { p1: [1900, -950, -112], p2: [1180, -117], p3: [1540, -297] } };
          const fy = land ? Math.round((H - G.fh) / 2) : Math.round(H * 0.238);
          root.querySelectorAll(".bframe").forEach((f) => { f.style.height = G.fh + "px"; if (land) f.style.top = fy + "px"; });
          Object.entries(G.p).forEach(([c, [w, x, y = 0]]) => { const im = q("." + c); im.style.width = w + "px"; im.style.left = x + "px"; im.style.top = y + "px"; });

          // Tile: the frame at 42% scale, centred in the frame. Stack offsets: 2.4u per tile.
          const S = 0.42, off = 26;
          const cx = W / 2, cy = H / 2;
          const dx = cx - (G.fx + G.fw / 2), dy = cy - (fy + G.fh / 2);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(q(".f3"), { x: 0, y: 0, scale: 1 }, { x: dx - off, y: dy - off, scale: S, duration: F(24), ease: "power4.inOut" }, L(1200));
          // Two more pages land on the eighths (f1215 from the left, f1230 from the right).
          tl.fromTo(q(".f2"), { x: dx - W, y: dy, scale: S }, { x: dx, y: dy, duration: F(12), ease: "expo.out" }, L(1215));
          tl.fromTo(q(".f1"), { x: dx + W, y: dy + off, scale: S }, { x: dx + off, y: dy + off, duration: F(12), ease: "expo.out" }, L(1230));
          // Stack bounds (in frame px) -> ink panel rises over the stack, then opens to full frame.
          const tw = G.fw * S, th = G.fh * S;
          const top = cy - th / 2 - off, bot = cy + th / 2 + off, left = cx - tw / 2 - off, right = cx + tw / 2 + off;
          const clip = (t, r, b, l) => `inset(${t}px ${r}px ${b}px ${l}px)`;
          tl.fromTo(q(".inkp"), { clipPath: clip(bot, W - right, H - bot, left) },
            { clipPath: clip(top, W - right, H - bot, left), duration: F(12), ease: "power4.inOut" }, L(1245));
          tl.to(q(".inkp"), { clipPath: clip(0, 0, 0, 0), duration: F(30), ease: "power4.inOut" }, L(1260));
          tl.set({}, {}, L(1320));
          window.__timelines["collapse"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
