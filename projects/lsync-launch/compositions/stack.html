<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/shared.css">
      <style>
        #stack .pc { position: absolute; display: block; will-change: transform; }
      </style>
      <!-- Bars 3-4 (f240-480). REF_A photo stack: a new rectangle lands on every eighth (15 f) at an offset on the grid,
           the four most recent stay, the layer pushes in slowly. Real material only: the council's officer cards and
           crops of the live site. f465: clears to an empty field (the silence before the wordmark). -->
      <div data-hf-id="hf-lqgo" id="stack" class="beat" data-composition-id="stack" data-width="1080" data-height="1920">
        <div data-hf-id="hf-wvtw" class="stage sg"></div>
      </div>
      <script>
        (function () {
          const root = document.querySelector("#stack");
          const st = root.querySelector(".stage");
          const { W, H, land } = LK.dims(root);
          const { C, F, el } = LK;
          const T0 = 240, L = (f) => F(f - T0);
          const tl = gsap.timeline({ paused: true });
          el(st, "div", "fill", { background: C.paper });
          const layer = el(st, "div", "fill");

          // [file, width, centre x, centre y, entry direction] in landscape 1920x1080 units.
          const P = [
            ["officer-16", 340, 960, 540, "u"], ["ui-records", 430, 1140, 470, "r"], ["officer-13", 300, 790, 600, "l"],
            ["ui-stats", 780, 990, 720, "d"], ["officer-1", 360, 1190, 560, "r"], ["ui-hero", 410, 750, 470, "l"],
            ["officer-17", 320, 1040, 520, "u"], ["ui-table", 720, 900, 650, "d"], ["officer-15", 340, 720, 560, "l"],
            ["ui-tabs", 560, 1150, 430, "r"], ["officer-12", 320, 1220, 640, "r"], ["ui-form", 380, 870, 520, "u"],
            ["officer-10", 340, 1070, 600, "d"], ["officer-4", 320, 780, 470, "l"], ["officer-6", 380, 975, 545, "u"],
          ];
          const ASPECT = { "ui-records": 910 / 1160, "ui-stats": 288 / 1400, "ui-hero": 1140 / 1240, "ui-table": 535 / 1400, "ui-tabs": 447 / 1400, "ui-form": 1200 / 1360 };
          const map = land ? (x, y, w) => [x, y, w] : (x, y, w) => [540 + (x - 960) * 0.62, 940 + (y - 540) * 2.1, Math.min(w * 1.3, 940)];
          const D = { u: [0, -70], d: [0, 70], l: [-90, 0], r: [90, 0] };
          const pcs = P.map(([f, w0, x0, y0, d], i) => {
            const [x, y, w] = map(x0, y0, w0);
            const h = w * (ASPECT[f] || 1);
            const im = el(layer, "img", "pc", { width: w, height: h, left: x - w / 2, top: y - h / 2 });
            im.src = `assets/stack/${f}.jpg`; im.alt = "";
            return { im, d };
          });
          pcs.forEach(({ im, d }, i) => {
            const at = L(240 + i * 15);
            // Lands hard on the eighth: appears and travels the last few px with expo.out (8 f).
            LK.live(tl, im, at, i + 4 < pcs.length ? L(240 + (i + 4) * 15) : L(465));
            tl.fromTo(im, { x: D[d][0], y: D[d][1] }, { x: 0, y: 0, duration: F(8), ease: "expo.out" }, at);
          });
          // Continuous push-in and drift under the whole stack (the camera never rests here).
          tl.fromTo(layer, { scale: 1, x: 0 }, { scale: 1.1, x: land ? -40 : -20, duration: L(465), ease: "none" }, 0);
          tl.set({}, {}, L(480));
          window.__timelines["stack"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
